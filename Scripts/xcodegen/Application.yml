targetTemplates:
  CommonTarget:
    type: application
    platform: iOS
    sources:
      - path: ../../${PROJECT_NAME}
        excludes: [Resources/Plist/Info.plist]

    scheme:
      testTargets:
        - UnitTests
    settings:
      groups: [CommonSettings]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        DEVELOPMENT_TEAM: ${TEAM_ID}
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          PROVISIONING_PROFILE_SPECIFIER: match Development ${BUNDLE_ID}
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          PROVISIONING_PROFILE_SPECIFIER: match AppStore ${BUNDLE_ID}
          CODE_SIGN_IDENTITY: "Apple Distribution"
    dependencies:
      - package: Firebase
        product: FirebaseAnalyticsCore
    
    preBuildScripts:
      - script: ./scripts/swiftgen/swiftgen.sh
        name: Run SwiftGen
        outputFiles:
          - $(SRCROOT)/${PROJECT_NAME}/Resources/Generated/Localizations.swift
    postCompileScripts:
      - script: ./scripts/swiftlint/swiftlint.sh
        name: Run Swiftlint
        basedOnDependencyAnalysis: false
    info:
      path: ../../${PROJECT_NAME}/Resources/Plist/Info.plist
      properties:
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchStoryboardName: LaunchScreen.storyboard
        ITSAppUsesNonExemptEncryption: NO
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

        FirebaseAutomaticScreenReportingEnabled: NO
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: NO
        GOOGLE_ANALYTICS_IDFV_COLLECTION_ENABLED: NO

settingGroups:
  CommonSettings:
    # Architectures
    SDKROOT: auto
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: $(inherited)
    # Build options
    ENABLE_PREVIEWS: YES
    EXCLUDED_SOURCE_FILE_NAMES: $(inherited) Resources/Plist/Info.plist
    # Deployment
    DEVELOPMENT_ASSET_PATHS: '"${PROJECT_NAME}/Resources/Assets/Preview Assets.xcassets"'
    IPHONEOS_DEPLOYMENT_TARGET: 26.0
    # Linking
    LD_RUNPATH_SEARCH_PATHS: $(inherited) '@executable_path/Frameworks'
    # Localization
    SWIFT_EMIT_LOC_STRINGS: YES
    # Packaging
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: ${PROJECT_NAME}/Resources/Plist/Info.plist
    INFOPLIST_OUTPUT_FORMAT: same-as-input
    PRODUCT_NAME: $(TARGET_NAME)
    # Signing
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    # Versioning
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: 3.0.2
    # Asset Catalog Compiler - Options
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: true
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # Swift Compiler - Language
    SWIFT_VERSION: 5.0
    # User-Defined
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    TARGETED_DEVICE_FAMILY: 1
    # Info.plist Values
    BUNDLE_DISPLAY_NAME: ${BUNDLE_DISPLAY_NAME}
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphonesimulator*]: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphoneos*]: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphonesimulator*]: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphoneos*]: YES
    INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphonesimulator*]: YES
    INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphoneos*]: YES
    INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen.storyboard
    INFOPLIST_KEY_UIStatusBarStyle[sdk=iphonesimulator*]: UIStatusBarStyleDefault
    INFOPLIST_KEY_UIStatusBarStyle[sdk=iphoneos*]: UIStatusBarStyleDefault
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

targets:
  ${TARGET_NAME}:
    templates: [CommonTarget]

  UnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../UnitTests
    dependencies:
      - target: ${TARGET_NAME}
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.tests
        SWIFT_VERSION: 5.0
